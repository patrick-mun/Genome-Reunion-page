<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Génome Réunion : justification du choix méthodologique S_div</title>
  <style>
    :root {
      --accent: #1f4e79;
      --accent-soft: #eaf0f6;
      --text: #1a1a1a;
      --muted: #555;
      --border: #d9d9d9;
      --callout-bg: #f4f7fb;
      --font-body: "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
      --font-head: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html { background: #e9ecef; }
    body {
      margin: 0;
      background: #f0f0f0;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.58;
    }
    h1, h2, h3, h4 {
      color: var(--accent);
      font-family: var(--font-head);
      line-height: 1.25;
    }
    h1 { font-size: 2em; }
    h2 {
      margin-top: 1.8em;
      border-bottom: 2px solid var(--accent-soft);
      padding-bottom: .2em;
      font-size: 1.4em;
      break-before: page;
    }
    h3 { margin-top: 1.4em; color: var(--text); font-size: 1.15em; }
    p { margin: 0 0 1em; }
    strong { color: #000; }
    a { color: var(--accent); }
    code, pre { font-family: "Courier New", monospace; }
    code { padding: 1px 4px; border-radius: 3px; background: #f0f0f0; font-size: .88em; }
    pre {
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #f4f4f4;
      font-size: .8em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      break-inside: avoid;
    }
    section.cover, nav.toc-page, main {
      max-width: 800px;
      margin: 24px auto;
      padding: 48px 56px;
      background: #fff;
      box-shadow: 0 1px 8px rgba(0,0,0,.12);
    }
    section.cover {
      display: flex;
      min-height: calc(297mm - 40mm);
      flex-direction: column;
      break-after: page;
    }
    .cover-logo { margin-bottom: auto; padding-bottom: 10mm; }
    .cover-accent-band {
      height: 4px;
      margin-bottom: 10mm;
      border-radius: 2px;
      background: var(--accent);
    }
    .cover-center {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
    }
    .cover-center h1 { margin: 0 0 .3em; border: 0; font-size: 2.1em; break-before: avoid; }
    .cover-subtitle { color: var(--muted); font-size: 1.15em; font-style: italic; }
    .cover-meta { margin-top: auto; padding-top: 8mm; border-top: 1px solid var(--border); }
    .cover-meta table { width: 100%; margin: 0; font-size: .93em; }
    .cover-meta th, .cover-meta td {
      padding: 4px 14px 4px 0;
      border: 0;
      background: none;
      vertical-align: top;
    }
    .cover-meta th { width: 130px; color: var(--accent); }
    nav.toc-page { break-after: page; }
    nav.toc-page h2 { margin: 0 0 8mm; border: 0; font-size: 1.5em; break-before: avoid; }
    nav.toc-page ol { margin: 0; padding: 0; list-style: none; }
    nav.toc-page li { margin-bottom: 1px; }
    a.toc-entry {
      display: flex;
      align-items: baseline;
      padding: 4px 2px;
      color: var(--text);
      text-decoration: none;
    }
    .toc-title { flex: none; font-size: .96em; }
    .toc-dots { min-width: 20px; margin: 0 8px 4px; flex: 1; border-bottom: 1px dotted var(--border); }
    .toc-page-num { min-width: 20px; flex: none; color: var(--muted); font-size: .9em; text-align: right; }
    .summary, aside.callout {
      border-left: 4px solid var(--accent);
      border-radius: 0 4px 4px 0;
      break-inside: avoid;
    }
    .summary { margin: 1.5em 0; padding: 16px 20px; background: var(--accent-soft); }
    .summary h2 { margin-top: 0; border: 0; break-before: avoid; }
    aside.callout {
      margin: 1.2em 0;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--callout-bg);
    }
    aside.callout .label {
      display: block;
      margin-bottom: .3em;
      color: var(--accent);
      font-size: .78em;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    ul, ol { margin: 0 0 1em; padding-left: 1.4em; }
    li { margin-bottom: .3em; }
    table {
      width: 100%;
      margin: 1em 0;
      border-collapse: collapse;
      font-size: .95em;
      break-inside: avoid;
    }
    th, td { padding: 8px 10px; border: 1px solid var(--border); text-align: left; word-break: break-word; }
    thead th { background: var(--accent); color: #fff; }
    tbody tr:nth-child(even) { background: #f7f9fb; }
    .caption { margin-top: .4em; color: var(--muted); font-size: .88em; font-style: italic; }
    footer.page-footer { position: running(docfooter); color: var(--muted); font-size: .85em; }
    .load-error {
      max-width: 800px;
      margin: 48px auto;
      padding: 24px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fff;
      color: #991b1b;
    }
    @page {
      size: A4;
      margin: 20mm;
      @bottom-left {
        content: element(docfooter);
        color: var(--muted);
        font-family: var(--font-body);
        font-size: 9pt;
      }
      @bottom-right {
        content: "Page " counter(page) " / " counter(pages);
        color: var(--muted);
        font-family: var(--font-body);
        font-size: 9pt;
      }
    }
    @page :first { @bottom-left { content: none; } @bottom-right { content: none; } }
    nav.toc-page { page: tocpage; }
    @page tocpage { @bottom-left { content: none; } @bottom-right { content: none; } }
    @media (max-width: 820px) {
      section.cover, nav.toc-page, main { margin: 0; padding: 28px 20px; box-shadow: none; }
      .cover-meta th { width: auto; }
    }
    @media print {
      html, body { background: #fff; }
      body { font-size: 11.5pt; }
      section.cover, nav.toc-page, main { max-width: none; margin: 0; padding: 0; box-shadow: none; }
      h1, h2, h3, h4 { break-after: avoid; }
      table, aside.callout, .summary, pre { break-inside: avoid; }
      p { orphans: 3; widows: 3; }
      a { color: #000; text-decoration: none; }
    }
  </style>
</head>
<body>
  <div id="document-root" aria-live="polite"></div>
  <noscript>
    <div class="load-error">JavaScript est nécessaire pour assembler les sections de ce document.</div>
  </noscript>
  <script>
    (async function () {
      const root = document.getElementById('document-root');
      const sectionPaths = [
        'sdiv_parts/s1.html',
        'sdiv_parts/s2.html',
        'sdiv_parts/s3.html',
        'sdiv_parts/s4.html',
        'sdiv_parts/s5.html',
        'sdiv_parts/s6.html',
        'sdiv_parts/s7.html',
        'sdiv_parts/s8.html'
      ];

      const cover = `
<section class="cover" id="cover">
  <div class="cover-logo"><span style="font-family:Georgia,serif;font-size:1.5em;font-weight:700;color:var(--accent);letter-spacing:.06em;">GÉNOME RÉUNION</span></div>
  <div class="cover-accent-band"></div>
  <div class="cover-center">
    <h1>Justification du choix méthodologique S_div</h1>
    <div class="cover-subtitle">Prélèvement en population insulaire admixée : évaluation des méthodologies existantes et dérivation de la stratégie retenue</div>
  </div>
  <div class="cover-meta">
    <table>
      <tr><th>Projet</th><td>Génome Réunion, référentiel génomique réunionnais</td></tr>
      <tr><th>Porteur</th><td>Service de Génétique Moléculaire UF1640, CHU de La Réunion</td></tr>
      <tr><th>Auteur</th><td>Patrick Munier</td></tr>
      <tr><th>Objet</th><td>Document de justification des choix de conception de l'algorithme de sélection</td></tr>
      <tr><th>Rattachement</th><td>Méthodologie de sélection V3.5, section algorithme</td></tr>
      <tr><th>Date</th><td>23 juillet 2026</td></tr>
    </table>
  </div>
</section>`;

      const tocItems = [
        ['s1', '1. Objet et cahier des charges'],
        ['s2', '2. Sept contraintes propres à une population insulaire admixée'],
        ['s3', '3. Évaluation des méthodologies existantes'],
        ['s4', "4. Le cas particulier de la couverture d'ensemble"],
        ['s5', '5. Construction de S_div, composante par composante'],
        ['s6', '6. Le bras de découverte'],
        ['s7', '7. Traçabilité des décisions et limites acceptées'],
        ['s8', '8. Références']
      ];
      const toc = `<nav class="toc-page" id="toc"><h2>Sommaire</h2><ol>${tocItems.map(([id, title]) => `<li><a class="toc-entry" href="#${id}"><span class="toc-title">${title}</span><span class="toc-dots"></span><span class="toc-page-num"></span></a></li>`).join('')}</ol></nav>`;
      const footer = '<footer class="page-footer"><span>Génome Réunion · Justification du choix méthodologique S_div · diffusion restreinte</span></footer>';

      try {
        const responses = await Promise.all(sectionPaths.map(path => fetch(path)));
        const failed = responses.find(response => !response.ok);
        if (failed) throw new Error(`Chargement impossible : ${failed.url}`);
        const sections = await Promise.all(responses.map(response => response.text()));
        root.innerHTML = cover + toc + '<main>' + sections.join('\n') + '</main>' + footer;

        document.querySelectorAll('a.toc-entry').forEach(link => {
          link.addEventListener('click', event => {
            const target = document.querySelector(link.getAttribute('href'));
            if (target) {
              event.preventDefault();
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        });

        window.PagedConfig = {
          auto: true,
          after: function () {
            document.querySelectorAll('a.toc-entry').forEach(link => {
              const target = document.querySelector(link.getAttribute('href'));
              const number = link.querySelector('.toc-page-num');
              const page = target && target.closest('.pagedjs_page');
              if (number && page) number.textContent = page.getAttribute('data-page-number') || '';
            });
          }
        };
        const paged = document.createElement('script');
        paged.src = 'https://cdn.jsdelivr.net/npm/pagedjs@0.4.3/dist/paged.polyfill.min.js';
        paged.defer = true;
        document.head.appendChild(paged);
      } catch (error) {
        console.error(error);
        root.innerHTML = '<div class="load-error"><strong>Le document n’a pas pu être assemblé.</strong><br>Vérifiez la présence des fichiers du dossier <code>template/sdiv_parts</code>.</div>';
      }
    })();
  </script>
</body>
</html>
