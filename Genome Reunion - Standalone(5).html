  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

20%22 height=%2272%22 viewBox=%220 0 280 72%22&gt;&lt;g fill=%22none%22 stroke-width=%222%22 stroke-linecap=%22round%22&gt;&lt;path d=%22M0,20 C18,4 36,4 54,20 C72,36 90,36 108,20 C126,4 144,4 162,20 C180,36 198,36 216,20 C234,4 252,4 270,20%22 stroke=%22%231E6E8C%22/&gt;&lt;path d=%22M0,38 C18,22 36,22 54,38 C72,54 90,54 108,38 C126,22 144,22 162,38 C180,54 198,54 216,38 C234,22 252,22 270,38%22 stroke=%22%23E8654A%22 opacity=%220.7%22/&gt;&lt;path d=%22M0,56 C18,40 36,40 54,56 C72,72 90,72 108,56 C126,40 144,40 162,56 C180,72 198,72 216,56 C234,40 252,40 270,56%22 stroke=%22%239FD3E0%22 opacity=%220.45%22/&gt;&lt;/g&gt;&lt;/svg&gt;'); background-repeat:repeat; background-size:320px 72px; animation:gr-wave-pan 26s linear infinite;\"><\u002Fdiv>\n    <div style=\"position:absolute; right:-8%; top:-10%; width:min(48vw,560px); height:min(48vw,560px); border-radius:50%; background:radial-gradient(circle, rgba(30,110,140,0.45), transparent 62%); pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:absolute; right:0; top:50%; transform:translateY(-50%); width:min(54vw,640px); aspect-ratio:1.1; background:radial-gradient(ellipse at 38% 50%, rgba(232,101,74,0.13) 0%, rgba(192,133,44,0.06) 40%, transparent 68%); pointer-events:none;\"><\u002Fdiv>\n    <canvas id=\"gr-hero-canvas\" style=\"position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1;\"><\u002Fcanvas>\n\n    <div style=\"position:relative; z-index:2; max-width:1180px; margin:0 auto;\">\n      <div style=\"position:relative; z-index:2; max-width:760px; margin-bottom:clamp(48px,7vh,72px);\">\n          <div data-hero-anim=\"\" style=\"display:inline-flex; align-items:center; gap:9px; font-family:'Space Grotesk',sans-serif; font-size:0.72rem; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#9FD3E0; border:1px solid rgba(159,211,224,0.35); border-radius:100px; padding:8px 16px; margin-bottom:30px;\">\n            <span style=\"width:7px; height:7px; border-radius:50%; background:#E8654A; flex:none;\"><\u002Fspan>\n            Premier référentiel génomique de La Réunion\n          <\u002Fdiv>\n          <h1 data-hero-anim=\"\" style=\"font-family:'Spectral',serif; font-weight:600; font-size:clamp(2.2rem,4.4vw,4rem); line-height:1.07; letter-spacing:-0.015em; margin-bottom:16px;\">\n            La Réunion construit sa propre carte génétique. <span style=\"color:#E8654A;\">Pour une médecine enfin à votre image.<\u002Fspan>\n          <\u002Fh1>\n          <p data-hero-anim=\"\" style=\"font-family:'Spectral',serif; font-style:italic; font-size:clamp(1.25rem,2.1vw,1.7rem); color:#F4AA8A; letter-spacing:0.02em; margin-bottom:22px;\">Nout' léritaz, nout' santé.<\u002Fp>\n          <p data-hero-anim=\"\" style=\"font-size:clamp(0.96rem,1.2vw,1.07rem); line-height:1.72; color:#CFE3EA; font-weight:300;\">\n            À La Réunion, chaque habitant porte l'héritage de plusieurs continents. Pourtant les outils médicaux ont été conçus pour d'autres populations. <strong style=\"color:#fff; font-weight:500;\">Génome Réunion bâtit la première référence génétique de l'île,<\u002Fstrong> pour que chaque soin s'adapte enfin à vous.\n          <\u002Fp>\n          <div data-hero-anim=\"\" style=\"display:flex; flex-wrap:wrap; gap:14px; margin-top:34px;\">\n            <a href=\"#participer\" style=\"display:inline-flex; align-items:center; gap:9px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:0.98rem; color:#fff; background:var(--gr-accent,#E8654A); text-decoration:none; padding:15px 28px; border-radius:100px;\" style-hover=\"transform:translateY(-2px)\">Je veux participer →<\u002Fa>\n            <a href=\"#probleme\" style=\"display:inline-flex; align-items:center; gap:9px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:0.98rem; color:#EDEAE2; background:transparent; border:1px solid rgba(255,255,255,0.32); text-decoration:none; padding:15px 28px; border-radius:100px;\" style-hover=\"background:rgba(255,255,255,0.08)\">Pourquoi c'est urgent ?<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <!-- stats bar -->\n      <div id=\"gr-stats-bar\" style=\"position:relative; z-index:2; display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(12px,2vw,28px); padding-top:34px; border-top:1px solid rgba(255,255,255,0.16);\">\n        <div><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(1.8rem,4vw,2.8rem); color:#fff; line-height:1;\"><span data-count=\"2500\">2 500<\u002Fspan><\u002Fdiv><div style=\"font-size:0.82rem; color:#9FD3E0; margin-top:7px;\">Réunionnais·es participants<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(1.8rem,4vw,2.8rem); color:#fff; line-height:1;\"><span data-count=\"100\">100<\u002Fspan><\u002Fdiv><div style=\"font-size:0.82rem; color:#9FD3E0; margin-top:7px;\">familles étudiées<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(1.8rem,4vw,2.8rem); color:#fff; line-height:1;\"><span data-count=\"350\">350<\u002Fspan><\u002Fdiv><div style=\"font-size:0.82rem; color:#9FD3E0; margin-top:7px;\">génomes complets séquencés<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(1.8rem,4vw,2.8rem); color:#fff; line-height:1;\">4<\u002Fdiv><div style=\"font-size:0.82rem; color:#9FD3E0; margin-top:7px;\">modules IA clinique<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LE PROBLÈME -->\n  <section id=\"probleme\" style=\"background:#1E1008; color:#F4EDE0;\">\n    <div style=\"max-width:1180px; margin:0 auto; padding:clamp(64px,10vw,110px) clamp(20px,5vw,40px);\">\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); margin-bottom:52px;\">\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.74rem; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#E8654A; margin-bottom:18px;\">Pourquoi c'est urgent<\u002Fdiv>\n        <div style=\"font-family:'Spectral',serif; font-weight:600; font-size:clamp(3.5rem,8vw,7rem); line-height:1; color:#E8654A; margin-bottom:12px;\">≥ 80 %<\u002Fdiv>\n        <p style=\"font-family:'Spectral',serif; font-size:clamp(1.2rem,2.3vw,1.8rem); font-weight:500; color:#F4EDE0; max-width:38ch; line-height:1.3;\">des individus dans les principales bases de données génétiques mondiales sont d'origine européenne, laissant les autres populations sous-représentées.<\u002Fp>\n        <p style=\"font-size:0.82rem; color:#8A7A6A; margin-top:12px;\">Estimation variable selon la base de référence considérée (gnomAD, 1000 Genomes, HGMD…)<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px;\">\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1) .07s, transform .7s cubic-bezier(.16,1,.3,1) .07s; background:rgba(255,255,255,0.05); border:1px solid rgba(244,237,224,0.14); border-radius:18px; padding:28px; min-height:220px; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s;\" style-hover=\"transform:translateY(-10px); box-shadow:0 28px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(232,101,74,0.5), 0 0 40px rgba(232,101,74,0.15); border-color:rgba(232,101,74,0.6); background:rgba(255,255,255,0.1);\">\n          <div style=\"width:48px; height:48px; border-radius:13px; background:rgba(232,101,74,0.18); display:flex; align-items:center; justify-content:center; margin-bottom:18px;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E8654A\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3h6M10 3v5.5L5.5 17a2 2 0 0 0 1.8 3h9.4a2 2 0 0 0 1.8-3L14 8.5V3\"><\u002Fpath><path d=\"M7.5 14h9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <p style=\"font-size:1rem; line-height:1.68; color:#E8D8C0; margin-top:auto;\">Un médicament dosé pour un Européen peut être <strong style=\"color:#fff; font-weight:500;\">trop fort ou insuffisant<\u002Fstrong> pour un patient réunionnais.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1) .14s, transform .7s cubic-bezier(.16,1,.3,1) .14s; background:rgba(255,255,255,0.05); border:1px solid rgba(244,237,224,0.14); border-radius:18px; padding:28px; min-height:220px; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s;\" style-hover=\"transform:translateY(-10px); box-shadow:0 28px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(232,101,74,0.5), 0 0 40px rgba(232,101,74,0.15); border-color:rgba(232,101,74,0.6); background:rgba(255,255,255,0.1);\">\n          <div style=\"width:48px; height:48px; border-radius:13px; background:rgba(232,101,74,0.18); display:flex; align-items:center; justify-content:center; margin-bottom:18px;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E8654A\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.2-3.2\"><\u002Fpath><path d=\"M8.5 11l1.8 1.8L14 9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <p style=\"font-size:1rem; line-height:1.68; color:#E8D8C0; margin-top:auto;\">Un variant classé <strong style=\"color:#fff; font-weight:500;\">\"rare\"<\u002Fstrong> en Europe peut être parfaitement courant et bénin à La Réunion, mais personne ne le sait encore.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1) .21s, transform .7s cubic-bezier(.16,1,.3,1) .21s; background:rgba(255,255,255,0.05); border:1px solid rgba(244,237,224,0.14); border-radius:18px; padding:28px; min-height:220px; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s;\" style-hover=\"transform:translateY(-10px); box-shadow:0 28px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(232,101,74,0.5), 0 0 40px rgba(232,101,74,0.15); border-color:rgba(232,101,74,0.6); background:rgba(255,255,255,0.1);\">\n          <div style=\"width:48px; height:48px; border-radius:13px; background:rgba(232,101,74,0.18); display:flex; align-items:center; justify-content:center; margin-bottom:18px;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E8654A\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 1 9 9\"><\u002Fpath><path d=\"M3 12h4l2-5 3 10 2-5h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <p style=\"font-size:1rem; line-height:1.68; color:#E8D8C0; margin-top:auto;\">Votre risque de diabète ou d'hypertension, calculé sur des données européennes, peut <strong style=\"color:#fff; font-weight:500;\">ne pas vous correspondre du tout.<\u002Fstrong><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CE QUE ÇA CHANGE POUR VOUS -->\n  <section id=\"benefices\" style=\"position:relative; overflow:hidden; background:#FBFAF7;\">\n    <canvas id=\"gr-dna-canvas\" style=\"position:absolute; inset:0; width:100%; height:100%; pointer-events:none; opacity:1;\"><\u002Fcanvas>\n    <div style=\"position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:clamp(72px,11vw,128px) clamp(20px,5vw,40px) clamp(40px,6vw,64px);\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); max-width:64ch;\">\n      <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.74rem; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--gr-accent,#E8654A); margin-bottom:14px;\">Ce que ça change pour vous<\u002Fdiv>\n      <h2 style=\"font-family:'Spectral',serif; font-weight:600; font-size:clamp(2rem,4.4vw,3.2rem); line-height:1.08; letter-spacing:-0.01em; margin-bottom:18px;\">Une médecine enfin pensée pour nous<\u002Fh2>\n      <p style=\"font-size:1.08rem; color:#41494F; line-height:1.65;\">Connaître le génome réunionnais, c'est permettre à chaque médecin de prendre de meilleures décisions : pour vous, vos enfants, et toute La Réunion.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; margin-top:46px;\">\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1) .05s, transform .7s cubic-bezier(.16,1,.3,1) .05s; background:#fff; border:1px solid #E8E3D8; border-radius:20px; padding:32px; min-height:240px; display:flex; flex-direction:column;\" style-hover=\"border-color:#1E6E8C; transform:translateY(-6px); box-shadow:0 20px 50px rgba(30,110,140,0.12);\">\n        <div style=\"width:48px; height:48px; border-radius:13px; background:rgba(30,110,140,0.1); display:flex; align-items:center; justify-content:center; margin-bottom:20px;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E6E8C\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3h6M10 3v5.5L5.5 17a2 2 0 0 0 1.8 3h9.4a2 2 0 0 0 1.8-3L14 8.5V3\"><\u002Fpath><path d=\"M7.5 14h9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-family:'Spectral',serif; font-size:1.4rem; font-weight:600; margin-bottom:10px;\">Le bon médicament, à la bonne dose<\u002Fh3>\n        <p style=\"font-size:0.95rem; color:#52595F; line-height:1.62; margin-top:auto;\">Votre héritage génétique détermine comment votre corps réagit aux médicaments. Avec une référence locale, les traitements pourront être ajustés à votre profil réel.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1) .12s, transform .7s cubic-bezier(.16,1,.3,1) .12s; background:#fff; border:1px solid #E8E3D8; border-radius:20px; padding:32px; min-height:240px; display:flex; flex-direction:column;\" style-hover=\"border-color:#1E6E8C; transform:translateY(-6px); box-shadow:0 20px 50px rgba(30,110,140,0.12);\">\n        <div style=\"width:48px; height:48px; border-radius:13px; background:rgba(30,110,140,0.1); display:flex; align-items:center; justify-content:center; margin-bottom:20px;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E6E8C\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.2-3.2\"><\u002Fpath><path d=\"M8.5 11l1.8 1.8L14 9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-family:'Spectral',serif; font-size:1.4rem; font-weight:600; margin-bottom:10px;\">Un diagnostic plus rapide<\u002Fh3>\n        <p style=\"font-size:0.95rem; color:#52595F; line-height:1.62; margin-top:auto;\">Quand un médecin trouve quelque chose d'inhabituel dans votre ADN, il peut vérifier si c'est simplement fréquent à La Réunion, et vous rassurer plus vite.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1) .19s, transform .7s cubic-bezier(.16,1,.3,1) .19s; background:#fff; border:1px solid #E8E3D8; border-radius:20px; padding:32px; min-height:240px; display:flex; flex-direction:column;\" style-hover=\"border-color:#1E6E8C; transform:translateY(-6px); box-shadow:0 20px 50px rgba(30,110,140,0.12);\">\n        <div style=\"width:48px; height:48px; border-radius:13px; background:rgba(30,110,140,0.1); display:flex; align-items:center; justify-content:center; margin-bottom:20px;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E6E8C\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 1 9 9\"><\u002Fpath><path d=\"M3 12h4l2-5 3 10 2-5h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-family:'Spectral',serif; font-size:1.4rem; font-weight:600; margin-bottom:10px;\">Une prévention faite pour La Réunion<\u002Fh3>\n        <p style=\"font-size:0.95rem; color:#52595F; line-height:1.62; margin-top:auto;\">Des calculs de risque adaptés à notre population : diabète, hypertension, maladies cardiaques, pour une prévention qui vous ressemble vraiment.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  \n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LA RÉUNION, CARREFOUR GÉNÉTIQUE -->\n  <section id=\"reunion\" style=\"background:#F1EEE6; border-top:1px solid #E8E3D8; border-bottom:1px solid #E8E3D8;\">\n    <div id=\"gr-reunion-grid\" style=\"max-width:1180px; margin:0 auto; padding:clamp(72px,11vw,128px) clamp(20px,5vw,40px); display:grid; grid-template-columns:1.05fr 0.95fr; gap:clamp(36px,6vw,72px); align-items:center;\">\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);\">\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.74rem; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--gr-accent,#E8654A); margin-bottom:14px;\">Une richesse unique au monde<\u002Fdiv>\n        <h2 style=\"font-family:'Spectral',serif; font-weight:600; font-size:clamp(2rem,4.4vw,3.2rem); line-height:1.08; letter-spacing:-0.01em; margin-bottom:20px;\">La Réunion, un carrefour génétique<\u002Fh2>\n        <p style=\"font-size:1.05rem; color:#41494F; margin-bottom:16px; line-height:1.65;\">Façonnée par l'Afrique, Madagascar, l'Inde du Sud, l'Europe et la Chine, la population réunionnaise porte une diversité génétique exceptionnelle. Chaque personne est une combinaison unique d'héritages.<\u002Fp>\n        <p style=\"font-size:1.05rem; color:#41494F; line-height:1.65;\">C'est précisément cette richesse que Génome Réunion met en lumière, pour en faire un atout au service de la santé de tous.<\u002Fp>\n        <div style=\"display:flex; gap:28px; margin-top:30px; flex-wrap:wrap;\">\n          <div><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.9rem; color:#0F3A56;\">5+<\u002Fdiv><div style=\"font-size:0.84rem; color:#6A7178;\">grandes ascendances<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.9rem; color:#0F3A56;\">360 ans<\u002Fdiv><div style=\"font-size:0.84rem; color:#6A7178;\">de peuplement métissé<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1) .1s, transform .7s cubic-bezier(.16,1,.3,1) .1s; background:#fff; border:1px solid #E8E3D8; border-radius:24px; padding:34px;\">\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:#6A7178; margin-bottom:14px;\">Composition ancestrale illustrative<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:13px;\">\n          <div style=\"display:flex; align-items:center; gap:12px;\"><span style=\"width:118px; font-size:0.82rem; color:#41494F; flex:none;\">Afrique / Malgache<\u002Fspan><div style=\"flex:1; height:9px; background:#EDEAE2; border-radius:6px; overflow:hidden;\"><div style=\"width:45%; height:100%; background:#1E6E8C; border-radius:6px;\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'Space Grotesk',sans-serif; font-size:0.78rem; color:#1E6E8C; font-weight:600; width:38px; text-align:right;\">45%<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px;\"><span style=\"width:118px; font-size:0.82rem; color:#41494F; flex:none;\">Inde du Sud<\u002Fspan><div style=\"flex:1; height:9px; background:#EDEAE2; border-radius:6px; overflow:hidden;\"><div style=\"width:25%; height:100%; background:#C0852C; border-radius:6px;\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'Space Grotesk',sans-serif; font-size:0.78rem; color:#C0852C; font-weight:600; width:38px; text-align:right;\">25%<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px;\"><span style=\"width:118px; font-size:0.82rem; color:#41494F; flex:none;\">Européen<\u002Fspan><div style=\"flex:1; height:9px; background:#EDEAE2; border-radius:6px; overflow:hidden;\"><div style=\"width:15%; height:100%; background:#2F4DA8; border-radius:6px;\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'Space Grotesk',sans-serif; font-size:0.78rem; color:#2F4DA8; font-weight:600; width:38px; text-align:right;\">15%<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px;\"><span style=\"width:118px; font-size:0.82rem; color:#41494F; flex:none;\">Zarabe / Gujarati<\u002Fspan><div style=\"flex:1; height:9px; background:#EDEAE2; border-radius:6px; overflow:hidden;\"><div style=\"width:8%; height:100%; background:#E8654A; border-radius:6px;\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'Space Grotesk',sans-serif; font-size:0.78rem; color:#E8654A; font-weight:600; width:38px; text-align:right;\">8%<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px;\"><span style=\"width:118px; font-size:0.82rem; color:#41494F; flex:none;\">Chine / Asie<\u002Fspan><div style=\"flex:1; height:9px; background:#EDEAE2; border-radius:6px; overflow:hidden;\"><div style=\"width:7%; height:100%; background:#1E7A4D; border-radius:6px;\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'Space Grotesk',sans-serif; font-size:0.78rem; color:#1E7A4D; font-weight:600; width:38px; text-align:right;\">7%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:0.72rem; color:#9098A0; margin-top:16px;\">Valeurs illustratives, à valider sur la cohorte finale.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- COMMENT ÇA MARCHE -->\n  <section id=\"methode\" style=\"max-width:1180px; margin:0 auto; padding:clamp(72px,11vw,128px) clamp(20px,5vw,40px) clamp(40px,6vw,64px);\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); max-width:64ch;\">\n      <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.74rem; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--gr-accent,#E8654A); margin-bottom:14px;\">Comment ça marche ?<\u002Fdiv>\n      <h2 style=\"font-family:'Spectral',serif; font-weight:600; font-size:clamp(2rem,4.4vw,3.2rem); line-height:1.08; letter-spacing:-0.01em; margin-bottom:18px;\">Trois étapes, un seul objectif<\u002Fh2>\n      <p style=\"font-size:1.08rem; color:#41494F; line-height:1.65;\">Ensemble, chaque Réunionnais·e contribue à bâtir cette première référence médicale commune.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; margin-top:46px;\">\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1) .05s, transform .7s cubic-bezier(.16,1,.3,1) .05s; background:#0F3A56; color:#EDEAE2; border-radius:20px; padding:32px;\">\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:3.2rem; font-weight:700; color:rgba(159,211,224,0.28); line-height:1;\">01<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; color:#9FD3E0; margin:14px 0 8px;\">La grande carte<\u002Fdiv>\n        <h3 style=\"font-family:'Spectral',serif; font-size:1.35rem; font-weight:600; color:#fff; margin-bottom:10px;\">2 500 personnes analysées<\u002Fh3>\n        <p style=\"font-size:0.92rem; color:#BFD6DE; line-height:1.62;\">2 500 Réunionnais·es volontaires donnent un échantillon. On analyse leur profil génétique pour dessiner la première carte de la diversité génétique de l'île.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1) .12s, transform .7s cubic-bezier(.16,1,.3,1) .12s; background:#fff; border:1px solid #E8E3D8; border-radius:20px; padding:32px;\">\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:3.2rem; font-weight:700; color:#EDE7DA; line-height:1;\">02<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; color:#C0852C; margin:14px 0 8px;\">L'héritage familial<\u002Fdiv>\n        <h3 style=\"font-family:'Spectral',serif; font-size:1.35rem; font-weight:600; margin-bottom:10px;\">100 familles réunionnaises<\u002Fh3>\n        <p style=\"font-size:0.92rem; color:#52595F; line-height:1.62;\">Ces familles servent de témoins pour valider le phasage haplotypique : on comprend ainsi comment les gènes se transmettent, propre à notre population métissée.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1) .19s, transform .7s cubic-bezier(.16,1,.3,1) .19s; background:#fff; border:1px solid #E8E3D8; border-radius:20px; padding:32px;\">\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:3.2rem; font-weight:700; color:#EDE7DA; line-height:1;\">03<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; color:#1E7A4D; margin:14px 0 8px;\">La référence complète<\u002Fdiv>\n        <h3 style=\"font-family:'Spectral',serif; font-size:1.35rem; font-weight:600; margin-bottom:10px;\">350 génomes intégraux<\u002Fh3>\n        <p style=\"font-size:0.92rem; color:#52595F; line-height:1.62;\">Pour 350 volontaires, on lit l'intégralité de leur ADN, la colonne vertébrale de toute la référence.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"gr-methode-resume\" data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:18px; background:#F1EEE6; border:1px solid #E8E3D8; border-radius:20px; padding:28px 32px;\">\n      <div style=\"display:flex; align-items:baseline; gap:12px;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--gr-accent,#E8654A); font-size:1.1rem;\">CHU<\u002Fspan><span style=\"font-size:0.9rem; color:#52595F;\">projet porté par le CHU de La Réunion<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; align-items:baseline; gap:12px;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--gr-accent,#E8654A); font-size:1.1rem;\">3 ans<\u002Fspan><span style=\"font-size:0.9rem; color:#52595F;\">de travail de terrain sur l'île<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; align-items:baseline; gap:12px;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--gr-accent,#E8654A); font-size:1.1rem;\">100 %<\u002Fspan><span style=\"font-size:0.9rem; color:#52595F;\">méthode vérifiable et publique<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- QUATRE OUTILS -->\n  <section style=\"position:relative; overflow:hidden; background:#0F3A56; color:#EDEAE2;\">\n    <canvas id=\"gr-nn-canvas\" style=\"position:absolute; inset:0; width:100%; height:100%; pointer-events:none;\"><\u002Fcanvas>\n    <div style=\"position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:clamp(72px,11vw,128px) clamp(20px,5vw,40px);\">\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); max-width:64ch;\">\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.74rem; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#9FD3E0; margin-bottom:14px;\">Ce que ça permet concrètement<\u002Fdiv>\n        <h2 style=\"font-family:'Spectral',serif; font-weight:600; font-size:clamp(2rem,4.4vw,3.2rem); line-height:1.08; letter-spacing:-0.01em; margin-bottom:18px;\">Quatre outils pour votre santé<\u002Fh2>\n        <p style=\"font-size:1.08rem; color:#CFE3EA; font-weight:300; line-height:1.65;\">Une fois la référence construite, ces quatre outils transforment la donnée en aide concrète pour les médecins réunionnais.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; margin-top:46px;\">\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .6s cubic-bezier(.16,1,.3,1) .04s, transform .6s cubic-bezier(.16,1,.3,1) .04s; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:26px; min-height:220px; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s;\" style-hover=\"transform:translateY(-6px); box-shadow:0 20px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.22); border-color:rgba(255,255,255,0.28); background:rgba(255,255,255,0.09);\"><div style=\"font-family:'Space Grotesk',sans-serif; color:#E8654A; font-weight:700; font-size:0.9rem; margin-bottom:10px;\">01<\u002Fdiv><h3 style=\"font-family:'Spectral',serif; font-size:1.2rem; font-weight:600; color:#fff; margin-bottom:8px;\">Identifier les gènes qui comptent<\u002Fh3><p style=\"font-size:0.88rem; color:#BFD6DE; line-height:1.6; margin-top:auto;\">Distinguer avec certitude les variants liés à une maladie de ceux qui sont simplement fréquents dans notre population.<\u002Fp><\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .6s cubic-bezier(.16,1,.3,1) .1s, transform .6s cubic-bezier(.16,1,.3,1) .1s; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:26px; min-height:220px; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s;\" style-hover=\"transform:translateY(-6px); box-shadow:0 20px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.22); border-color:rgba(255,255,255,0.28); background:rgba(255,255,255,0.09);\"><div style=\"font-family:'Space Grotesk',sans-serif; color:#E8654A; font-weight:700; font-size:0.9rem; margin-bottom:10px;\">02<\u002Fdiv><h3 style=\"font-family:'Spectral',serif; font-size:1.2rem; font-weight:600; color:#fff; margin-bottom:8px;\">Le médicament adapté à vous<\u002Fh3><p style=\"font-size:0.88rem; color:#BFD6DE; line-height:1.6; margin-top:auto;\">La bonne molécule, au bon dosage, selon votre profil génétique réel, pas un profil conçu pour un Européen moyen.<\u002Fp><\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .6s cubic-bezier(.16,1,.3,1) .16s, transform .6s cubic-bezier(.16,1,.3,1) .16s; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:26px; min-height:220px; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s;\" style-hover=\"transform:translateY(-6px); box-shadow:0 20px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.22); border-color:rgba(255,255,255,0.28); background:rgba(255,255,255,0.09);\"><div style=\"font-family:'Space Grotesk',sans-serif; color:#E8654A; font-weight:700; font-size:0.9rem; margin-bottom:10px;\">03<\u002Fdiv><h3 style=\"font-family:'Spectral',serif; font-size:1.2rem; font-weight:600; color:#fff; margin-bottom:8px;\">Vos racines génétiques<\u002Fh3><p style=\"font-size:0.88rem; color:#BFD6DE; line-height:1.6; margin-top:auto;\">Comprendre la mosaïque d'héritages qui forme votre génome : Afrique, Madagascar, Inde du Sud, Europe, Chine.<\u002Fp><\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .6s cubic-bezier(.16,1,.3,1) .22s, transform .6s cubic-bezier(.16,1,.3,1) .22s; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:26px; min-height:220px; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s;\" style-hover=\"transform:translateY(-6px); box-shadow:0 20px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.22); border-color:rgba(255,255,255,0.28); background:rgba(255,255,255,0.09);\"><div style=\"font-family:'Space Grotesk',sans-serif; color:#E8654A; font-weight:700; font-size:0.9rem; margin-bottom:10px;\">04<\u002Fdiv><h3 style=\"font-family:'Spectral',serif; font-size:1.2rem; font-weight:600; color:#fff; margin-bottom:8px;\">Votre risque personnel<\u002Fh3><p style=\"font-size:0.88rem; color:#BFD6DE; line-height:1.6; margin-top:auto;\">Calculer votre risque de diabète, d'hypertension ou de maladies cardiaques à partir de données réunionnaises, et non européennes.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ÉQUIPE -->\n  <section id=\"equipe\" style=\"max-width:1180px; margin:0 auto; padding:clamp(72px,11vw,128px) clamp(20px,5vw,40px) clamp(40px,6vw,64px);\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); max-width:64ch; margin-bottom:48px;\">\n      <div ,22 36,22 54,38 C72,54 90,54 108,38 C126,22 144,22 162,38 C180,54 198,54 216,38 C234,22 252,22 270,38%22 stroke=%22%221E6E8C%22/&gt;&lt;/g&gt;&lt;/svg&gt;'); background-repeat:repeat; background-size:200px auto; animation:gr-wave-pan 30s linear infinite;\"><\u002Fdiv>\n    <!-- halos colorés flottants -->\n    <div style=\"position:absolute; top:-80px; left:-60px; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, rgba(232,101,74,0.22) 0%, transparent 70%); filter:blur(40px); animation:gr-blob-drift1 12s ease-in-out infinite; pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:absolute; bottom:-100px; right:-40px; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle, rgba(159,211,224,0.18) 0%, transparent 70%); filter:blur(50px); animation:gr-blob-drift2 15s ease-in-out infinite; pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:absolute; top:40%; left:50%; transform:translateX(-50%); width:300px; height:300px; border-radius:50%; background:radial-gradient(circle, rgba(232,101,74,0.08) 0%, transparent 70%); filter:blur(60px); animation:gr-blob-drift3 18s ease-in-out infinite; pointer-events:none;\"><\u002Fdiv>\n    <canvas id=\"gr-cta-helix-canvas\" style=\"position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; opacity:0.85;\"><\u002Fcanvas>\n    <div style=\"position:relative; max-width:1180px; margin:0 auto; padding:clamp(72px,11vw,128px) clamp(20px,5vw,40px);\">\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); text-align:center; max-width:22ch; margin:0 auto 10px;\">\n        <div style=\"font-family:'Spectral',serif; font-style:italic; font-size:1.2rem; color:#9FD3E0; margin-bottom:14px;\">Anou ansanm<\u002Fdiv><h2 style=\"font-family:'Spectral',serif; font-weight:600; font-size:clamp(2.1rem,5vw,3.6rem); line-height:1.06; letter-spacing:-0.01em; text-align:center; width:fit-content; margin:0 auto\"><span style=\"white-space:nowrap\">Construisons-la<\u002Fspan><br>ensemble<\u002Fh2>\n        \n      <\u002Fdiv>\n      <p style=\"text-align:center; max-width:54ch; margin:18px auto 0; color:#CFE3EA; font-size:1.05rem; font-weight:300; line-height:1.65;\">Chacun a un rôle à jouer. Chaque participation est un cadeau à vos enfants et aux générations futures.<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:48px;\">\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .6s cubic-bezier(.16,1,.3,1) .05s, transform .6s cubic-bezier(.16,1,.3,1) .05s; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); border-radius:20px; padding:30px; transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s;\" style-hover=\"transform:translateY(-6px); box-shadow:0 20px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.22); border-color:rgba(255,255,255,0.28);\">\n          <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:#9FD3E0; margin-bottom:12px;\">Grand public &amp; donneurs<\u002Fdiv>\n          <h3 style=\"font-family:'Spectral',serif; font-size:1.45rem; font-weight:600; color:#fff; margin-bottom:10px;\">Donner avec l'EFS<\u002Fh3>\n          <p style=\"font-size:0.92rem; color:#BFD6DE; margin-bottom:20px; line-height:1.6;\">Un geste simple, anonyme et encadré qui fait avancer la recherche pour toute l'île.<\u002Fp>\n          <a href=\"https://dondesang.efs.sante.fr/\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex; align-items:center; gap:8px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:0.9rem; color:#0F3A56; background:#fff; text-decoration:none; padding:12px 22px; border-radius:100px;\" style-hover=\"transform:translateY(-2px)\">Se renseigner →<\u002Fa>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .6s cubic-bezier(.16,1,.3,1) .12s, transform .6s cubic-bezier(.16,1,.3,1) .12s; background:rgba(232,101,74,0.16); border:1px solid rgba(232,101,74,0.4); border-radius:20px; padding:30px; transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s;\" style-hover=\"transform:translateY(-6px); box-shadow:0 20px 60px rgba(232,101,74,0.25), 0 0 0 1px rgba(232,101,74,0.6); border-color:rgba(232,101,74,0.7);\">\n          <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:#F2B6A8; margin-bottom:12px;\">Institutions &amp; partenaires<\u002Fdiv>\n          <h3 style=\"font-family:'Spectral',serif; font-size:1.45rem; font-weight:600; color:#fff; margin-bottom:10px;\">Soutenir le projet<\u002Fh3>\n          <p style=\"font-size:0.92rem; color:#F0D2CB; margin-bottom:20px; line-height:1.6;\">Un investissement structurant et un actif durable pour le territoire réunionnais.<\u002Fp>\n          <a href=\"#equipe\" style=\"display:inline-flex; align-items:center; gap:8px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:0.9rem; color:#fff; background:var(--gr-accent,#E8654A); text-decoration:none; padding:12px 22px; border-radius:100px;\" style-hover=\"transform:translateY(-2px)\">Rencontrer l'équipe →<\u002Fa>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .6s cubic-bezier(.16,1,.3,1) .19s, transform .6s cubic-bezier(.16,1,.3,1) .19s; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); border-radius:20px; padding:30px; transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s;\" style-hover=\"transform:translateY(-6px); box-shadow:0 20px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.22); border-color:rgba(255,255,255,0.28);\">\n          <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:#9FD3E0; margin-bottom:12px;\">Tout le monde<\u002Fdiv>\n          <h3 style=\"font-family:'Spectral',serif; font-size:1.45rem; font-weight:600; color:#fff; margin-bottom:10px;\">Suivre l'actualité<\u002Fh3>\n          <p style=\"font-size:0.92rem; color:#BFD6DE; margin-bottom:20px; line-height:1.6;\">Rejoignez-nous sur les réseaux avec #NoutLeritazNoutSante.<\u002Fp>\n          <div style=\"display:flex; gap:10px;\">\n            <a href=\"#\" aria-label=\"LinkedIn\" style=\"width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; text-decoration:none;\" style-hover=\"background:rgba(255,255,255,0.2)\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M4.98 3.5A2.5 2.5 0 1 1 0 3.5a2.5 2.5 0 0 1 4.98 0zM.2 8.4h4.5V24H.2zM8.5 8.4h4.3v2.1h.06c.6-1.1 2.06-2.26 4.24-2.26 4.54 0 5.38 2.99 5.38 6.87V24h-4.5v-6.92c0-1.65-.03-3.78-2.3-3.78-2.3 0-2.66 1.8-2.66 3.66V24H8.5z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n            <a href=\"#\" aria-label=\"Instagram\" style=\"width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; text-decoration:none;\" style-hover=\"background:rgba(255,255,255,0.2)\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"><rect x=\"2\" y=\"2\" width=\"20\" height=\"20\" rx=\"5.5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><circle cx=\"17.6\" cy=\"6.4\" r=\"1.2\" fill=\"#fff\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><\u002Fa>\n            <a href=\"#\" aria-label=\"Facebook\" style=\"width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; text-decoration:none;\" style-hover=\"background:rgba(255,255,255,0.2)\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07c0 6 4.39 10.97 10.12 11.86v-8.39H7.08v-3.47h3.04V9.41c0-3.01 1.79-4.67 4.53-4.67 1.31 0 2.68.24 2.68.24v2.95h-1.51c-1.49 0-1.96.93-1.96 1.88v2.26h3.33l-.53 3.47h-2.8v8.39C19.61 23.04 24 18.07 24 12.07z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:#16242E; color:#9FB0B8;\">\n    <div id=\"gr-footer-grid\" style=\"max-width:1180px; margin:0 auto; padding:54px clamp(20px,5vw,40px) 40px; display:grid; grid-template-columns:1.6fr 1fr; gap:32px;\">\n      <div>\n        <img src=\"0798d22e-308f-40da-98f1-a856fcbda57b\" alt=\"Génome Réunion\" style=\"height:42px; filter:brightness(0) invert(1); opacity:0.95; margin-bottom:16px;\">\n        <p style=\"font-size:0.88rem; color:#7E909A; max-width:38ch; line-height:1.6;\">Le premier référentiel génomique dédié à la population réunionnaise. Nout' léritaz, nout' santé.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:#5E6E78; margin-bottom:14px;\">Naviguer<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px; font-size:0.88rem;\">\n          <a href=\"#probleme\" style=\"color:#9FB0B8; text-decoration:none;\" style-hover=\"color:#fff\">Le problème<\u002Fa>\n          <a href=\"#methode\" style=\"color:#9FB0B8; text-decoration:none;\" style-hover=\"color:#fff\">Comment ça marche<\u002Fa>\n          <a href=\"#equipe\" style=\"color:#9FB0B8; text-decoration:none;\" style-hover=\"color:#fff\">Équipe<\u002Fa>\n          <a href=\"#participer\" style=\"color:#9FB0B8; text-decoration:none;\" style-hover=\"color:#fff\">Participer<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(255,255,255,0.08);\">\n      <div style=\"max-width:1180px; margin:0 auto; padding:20px clamp(20px,5vw,40px); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:0.78rem; color:#5E6E78;\">\n        <span>CHU de La Réunion · Service de Génétique · Juin 2026<\u002Fspan>\n        <span>Référentiel génomique de La Réunion · V3.5<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:5200},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8654A&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const motion = this.props.motion !== false;\n\n    // hero-anim: reveal synchronously at mount — DC re-renders fight any deferred opacity change\n    const heroEls = Array.prototype.slice.call(document.querySelectorAll('[data-hero-anim]'));\n    heroEls.forEach(el => { el.style.transition = 'none'; el.style.opacity = '1'; el.style.transform = 'none'; });\n\n    if (!motion) {\n      document.querySelectorAll('[data-wave]').forEach(el => { el.style.animation = 'none'; });\n    }\n\n    // ── canvas particle-network animation ──\n    const canvas = document.getElementById('gr-hero-canvas');\n    if (canvas) {\n      const ctx = canvas.getContext('2d');\n      const ACCENT = 'rgba(232,101,74,';\n      const BLUE   = 'rgba(159,211,224,';\n      const N = 52, LINK_DIST = 130, LINK_DIST2 = LINK_DIST * LINK_DIST;\n      let W, H, pts;\n\n      const resize = () => {\n        const section = canvas.parentElement;\n        W = canvas.width  = section.offsetWidth;\n        H = canvas.height = section.offsetHeight;\n      };\n\n      const rand = (a, b) => a + Math.random() * (b - a);\n\n      const init = () => {\n        resize();\n        pts = [];\n        for (let i = 0; i < N; i++) {\n          const isAccent = Math.random() < 0.18;\n          pts.push({\n            x: rand(0, W), y: rand(0, H),\n            vx: rand(-0.22, 0.22), vy: rand(-0.18, 0.18),\n            r: rand(1.8, 4.2),\n            col: isAccent ? ACCENT : BLUE,\n            alpha: rand(0.35, 0.75)\n          });\n        }\n      };\n\n      let raf;\n      const draw = () => {\n        ctx.clearRect(0, 0, W, H);\n        // links\n        for (let i = 0; i < N; i++) {\n          for (let j = i + 1; j < N; j++) {\n            const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;\n            const d2 = dx*dx + dy*dy;\n            if (d2 < LINK_DIST2) {\n              const strength = 1 - d2 / LINK_DIST2;\n              ctx.strokeStyle = 'rgba(159,211,224,' + (strength * 0.28) + ')';\n              ctx.lineWidth = strength * 1.2;\n              ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();\n            }\n          }\n        }\n        // nodes\n        for (let i = 0; i < N; i++) {\n          const p = pts[i];\n          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);\n          ctx.fillStyle = p.col + p.alpha + ')';\n          ctx.fill();\n          // move\n          p.x += p.vx; p.y += p.vy;\n          if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;\n          if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;\n        }\n        raf = requestAnimationFrame(draw);\n      };\n\n      init();\n      if (motion) { draw(); } else { draw(); cancelAnimationFrame(raf); }\n\n      this._canvasResize = () => { resize(); };\n      window.addEventListener('resize', this._canvasResize);\n      this._canvasRaf = raf;\n      // store stop fn for unmount\n      this._stopCanvas = () => { cancelAnimationFrame(this._canvasRaf); };\n    }\n\n    // ── ADN helix background (section bénéfices) ──\n    const dnaCanvas = document.getElementById('gr-dna-canvas');\n    if (dnaCanvas) {\n      const dc = dnaCanvas.getContext('2d');\n      let DW, DH, dnaRaf, dnaOffset = 0;\n\n      const dnaResize = () => {\n        const sec = dnaCanvas.parentElement;\n        DW = dnaCanvas.width  = sec.offsetWidth;\n        DH = dnaCanvas.height = sec.offsetHeight;\n      };\n      dnaResize();\n\n      const drawHelix = (xCenter, amplitude, freq, phaseOffset, alphaStrand, alphaRung) => {\n        const steps = Math.ceil(DH / 2);\n        dc.beginPath();\n        dc.strokeStyle = 'rgba(30,110,140,' + alphaStrand + ')';\n        dc.lineWidth = 1.8;\n        for (let i = 0; i <= steps; i++) {\n          const y = (i / steps) * DH;\n          const x = xCenter + amplitude * Math.sin(y * freq + dnaOffset + phaseOffset);\n          i === 0 ? dc.moveTo(x, y) : dc.lineTo(x, y);\n        }\n        dc.stroke();\n        dc.beginPath();\n        dc.strokeStyle = 'rgba(232,101,74,' + (alphaStrand * 0.7) + ')';\n        dc.lineWidth = 1.6;\n        for (let i = 0; i <= steps; i++) {\n          const y = (i / steps) * DH;\n          const x = xCenter + amplitude * Math.sin(y * freq + dnaOffset + phaseOffset + Math.PI);\n          i === 0 ? dc.moveTo(x, y) : dc.lineTo(x, y);\n        }\n        dc.stroke();\n        const rungSpacing = Math.PI / freq;\n        for (let r = 0; r < 40; r++) {\n          const y = ((r * rungSpacing - (dnaOffset + phaseOffset) / freq) % DH + DH) % DH;\n          const x1 = xCenter + amplitude * Math.sin(y * freq + dnaOffset + phaseOffset);\n          const x2 = xCenter + amplitude * Math.sin(y * freq + dnaOffset + phaseOffset + Math.PI);\n          dc.beginPath();\n          dc.strokeStyle = 'rgba(30,110,140,' + alphaRung + ')';\n          dc.lineWidth = 1.2;\n          dc.moveTo(x1, y); dc.lineTo(x2, y); dc.stroke();\n          dc.beginPath(); dc.arc(x1, y, 2.8, 0, Math.PI * 2);\n          dc.fillStyle = 'rgba(30,110,140,' + (alphaStrand * 1.4) + ')'; dc.fill();\n          dc.beginPath(); dc.arc(x2, y, 2.8, 0, Math.PI * 2);\n          dc.fillStyle = 'rgba(232,101,74,' + (alphaStrand * 1.1) + ')'; dc.fill();\n        }\n      };\n\n      const drawDNA = () => {\n        dc.clearRect(0, 0, DW, DH);\n        const margin = 0.08;\n        const helixCount = Math.max(2, Math.round(DW / 220));\n        for (let i = 0; i < helixCount; i++) {\n          const t = helixCount === 1 ? 0.5 : i / (helixCount - 1);\n          const xPos = margin + t * (1 - 2 * margin);\n          const phase = i * Math.PI * 0.37;\n          drawHelix(DW * xPos, 44, 0.022, phase, 0.10, 0.06);\n        }\n        dnaOffset += 0.008;\n        dnaRaf = requestAnimationFrame(drawDNA);\n      };\n\n      drawDNA();\n      const dnaResizeH = () => { dnaResize(); };\n      window.addEventListener('resize', dnaResizeH);\n      this._stopDNA = () => { cancelAnimationFrame(dnaRaf); window.removeEventListener('resize', dnaResizeH); };\n    }\n\n    // ── Réseau de neurones IA (section quatre outils) ──\n    const nnCanvas = document.getElementById('gr-nn-canvas');\n    if (nnCanvas) {\n      const nc = nnCanvas.getContext('2d');\n      let NW, NH, nnRaf;\n      const NODES = [], PULSES = [], NODE_COUNT = 22, LINK_D = 180, LINK_D2 = LINK_D * LINK_D;\n      const LABELS = ['variant','dosage','risque','ADN','haplotype','prédiction','diagnostic','séquençage','phénotype','allèle','mutation','génome'];\n\n      const nnResize = () => {\n        const sec = nnCanvas.parentElement;\n        NW = nnCanvas.width  = sec.offsetWidth;\n        NH = nnCanvas.height = sec.offsetHeight;\n      };\n      nnResize();\n\n      // Init nodes\n      for (let i = 0; i < NODE_COUNT; i++) {\n        NODES.push({\n          x: Math.random() * NW, y: Math.random() * NH,\n          vx: (Math.random() - 0.5) * 0.18, vy: (Math.random() - 0.5) * 0.18,\n          r: 3.5 + Math.random() * 3,\n          pulse: Math.random() * Math.PI * 2,\n          accent: Math.random() < 0.22,\n          label: LABELS[i % LABELS.length],\n          labelAlpha: 0\n        });\n      }\n\n      // Build edges list\n      const getEdges = () => {\n        const edges = [];\n        for (let i = 0; i < NODES.length; i++) {\n          for (let j = i + 1; j < NODES.length; j++) {\n            const dx = NODES[i].x - NODES[j].x, dy = NODES[i].y - NODES[j].y;\n            if (dx*dx + dy*dy < LINK_D2) edges.push([i, j]);\n          }\n        }\n        return edges;\n      };\n\n      // Spawn a signal pulse on a random edge\n      let spawnTimer = 0;\n      const spawnPulse = (edges) => {\n        if (!edges.length) return;\n        const [a, b] = edges[Math.floor(Math.random() * edges.length)];\n        PULSES.push({ a, b, t: 0, speed: 0.006 + Math.random() * 0.008, accent: Math.random() < 0.3 });\n      };\n\n      const drawNN = () => {\n        nc.clearRect(0, 0, NW, NH);\n        const edges = getEdges();\n\n        // Edges\n        for (const [i, j] of edges) {\n          const dx = NODES[i].x - NODES[j].x, dy = NODES[i].y - NODES[j].y;\n          const d = Math.sqrt(dx*dx + dy*dy);\n          const alpha = (1 - d / LINK_D) * 0.18;\n          nc.strokeStyle = 'rgba(159,211,224,' + alpha + ')';\n          nc.lineWidth = 1;\n          nc.beginPath(); nc.moveTo(NODES[i].x, NODES[i].y); nc.lineTo(NODES[j].x, NODES[j].y); nc.stroke();\n        }\n\n        // Pulses\n        for (let p = PULSES.length - 1; p >= 0; p--) {\n          const pulse = PULSES[p];\n          pulse.t += pulse.speed;\n          if (pulse.t >= 1) {\n            // Activer le label du nœud destination\n            NODES[pulse.b].labelAlpha = 1;\n            PULSES.splice(p, 1); continue;\n          }\n          const na = NODES[pulse.a], nb = NODES[pulse.b];\n          const px = na.x + (nb.x - na.x) * pulse.t;\n          const py = na.y + (nb.y - na.y) * pulse.t;\n          const col = pulse.accent ? '232,101,74' : '159,211,224';\n          // trail\n          const grad = nc.createRadialGradient(px, py, 0, px, py, 10);\n          grad.addColorStop(0, 'rgba(' + col + ',0.85)');\n          grad.addColorStop(1, 'rgba(' + col + ',0)');\n          nc.beginPath(); nc.arc(px, py, 10, 0, Math.PI * 2);\n          nc.fillStyle = grad; nc.fill();\n          // dot\n          nc.beginPath(); nc.arc(px, py, 3, 0, Math.PI * 2);\n          nc.fillStyle = 'rgba(' + col + ',1)'; nc.fill();\n        }\n\n        // Nodes\n        for (const node of NODES) {\n          node.pulse += 0.03;\n          const pr = node.r + Math.sin(node.pulse) * 1.2;\n          const col = node.accent ? '232,101,74' : '159,211,224';\n          // glow\n          const g = nc.createRadialGradient(node.x, node.y, 0, node.x, node.y, pr * 3.5);\n          g.addColorStop(0, 'rgba(' + col + ',0.28)');\n          g.addColorStop(1, 'rgba(' + col + ',0)');\n          nc.beginPath(); nc.arc(node.x, node.y, pr * 3.5, 0, Math.PI * 2);\n          nc.fillStyle = g; nc.fill();\n          // core\n          nc.beginPath(); nc.arc(node.x, node.y, pr, 0, Math.PI * 2);\n          nc.fillStyle = 'rgba(' + col + ',0.75)'; nc.fill();\n          // label\n          if (node.labelAlpha > 0) {\n            nc.save();\n            nc.font = '600 11px \"Space Grotesk\",sans-serif';\n            nc.textAlign = 'center';\n            nc.letterSpacing = '0.04em';\n            const la = Math.min(node.labelAlpha, 1);\n            // pill background\n            const tw = nc.measureText(node.label).width;\n            const pw = tw + 14, ph = 18, px2 = node.x - pw/2, py2 = node.y - pr - 26;\n            nc.beginPath();\n            nc.roundRect(px2, py2, pw, ph, 5);\n            nc.fillStyle = 'rgba(15,58,86,' + (la * 0.82) + ')';\n            nc.strokeStyle = 'rgba(' + col + ',' + (la * 0.55) + ')';\n            nc.lineWidth = 1;\n            nc.fill(); nc.stroke();\n            nc.fillStyle = 'rgba(' + col + ',' + la + ')';\n            nc.fillText(node.label, node.x, py2 + 13);\n            nc.restore();\n            node.labelAlpha -= 0.008;\n          }\n          // move & wrap\n          node.x += node.vx; node.y += node.vy;\n          if (node.x < -20) node.x = NW + 20; else if (node.x > NW + 20) node.x = -20;\n          if (node.y < -20) node.y = NH + 20; else if (node.y > NH + 20) node.y = -20;\n        }\n\n        // Spawn pulses\n        spawnTimer++;\n        if (spawnTimer > 38) { spawnPulse(edges); spawnTimer = 0; }\n\n        nnRaf = requestAnimationFrame(drawNN);\n      };\n\n      drawNN();\n      const nnResizeH = () => { nnResize(); };\n      window.addEventListener('resize', nnResizeH);\n      this._stopNN = () => { cancelAnimationFrame(nnRaf); window.removeEventListener('resize', nnResizeH); };\n    }\n\n    const revealEls = Array.prototype.slice.call(document.querySelectorAll('[data-reveal]'));\n    const showAll = () => revealEls.forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });\n    if (!motion) {\n      showAll();\n    } else {\n      try {\n        const io = new IntersectionObserver((entries) => {\n          entries.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; io.unobserve(e.target); } });\n        }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });\n        revealEls.forEach(el => io.observe(el));\n      } catch (err) { showAll(); }\n      setTimeout(showAll, 4200);\n    }\n\n    const counters = Array.prototype.slice.call(document.querySelectorAll('[data-count]'));\n    const fmt = n => Math.round(n).toLocaleString('fr-FR');\n    const animateCount = el => {\n      const target = parseFloat(el.getAttribute('data-count'));\n      if (isNaN(target)) return;\n      const start = performance.now();\n      const step = t => {\n        const p = Math.min(1, (t - start) / 1500);\n        const e = 1 - Math.pow(1 - p, 3);\n        el.textContent = fmt(target * e);\n        if (p < 1) requestAnimationFrame(step);\n      };\n      requestAnimationFrame(step);\n    };\n    if (motion) {\n      try {\n        const io2 = new IntersectionObserver((entries) => {\n          entries.forEach(e => { if (e.isIntersecting) { animateCount(e.target); io2.unobserve(e.target); } });\n        }, { threshold: 0.5 });\n        counters.forEach(el => io2.observe(el));\n      } catch (err) {}\n    }\n\n    this._onScroll = () => {\n      const h = document.documentElement;\n      const sc = h.scrollTop || document.body.scrollTop || 0;\n      const max = (h.scrollHeight - h.clientHeight) || 1;\n      const bar = document.getElementById('gr-progress');\n      if (bar) bar.style.width = Math.min(100, sc / max * 100) + '%';\n      const nav = document.getElementById('gr-nav');\n      if (nav) {\n        nav.style.boxShadow = sc > 16 ? '0 1px 18px rgba(15,58,86,0.10)' : 'none';\n        nav.style.borderBottomColor = sc > 16 ? '#E8E3D8' : 'transparent';\n      }\n    };\n    // ── Grande hélice centrale CTA ──\n    const ctaCanvas = document.getElementById('gr-cta-helix-canvas');\n    if (ctaCanvas) {\n      const cc = ctaCanvas.getContext('2d');\n      let CW, CH, ctaRaf, ctaOffset = 0;\n      const ctaResize = () => {\n        const sec = ctaCanvas.parentElement;\n        CW = ctaCanvas.width  = sec.offsetWidth;\n        CH = ctaCanvas.height = sec.offsetHeight;\n      };\n      ctaResize();\n      // Couleurs du logo : bleu foncé, bleu moyen, orange\n      const waveColors = [\n        'rgba(159,211,224,0.13)',\n        'rgba(30,110,140,0.16)',\n        'rgba(232,101,74,0.16)'\n      ];\n      const waveW = 84;   // largeur d'une vague (comme le logo)\n      const lineGap = 16; // écart vertical entre les 3 vagues\n      const groupH = lineGap * 3 + 20; // hauteur d'un groupe de 3 vagues\n      const colW = 110;   // largeur d'une colonne\n\n      const drawWave = (x, y, color) => {\n        cc.beginPath();\n        cc.moveTo(x,      y);\n        cc.bezierCurveTo(x+11, y-10, x+22, y-10, x+32, y);\n        cc.bezierCurveTo(x+42, y+10, x+53, y+10, x+63, y);\n        cc.bezierCurveTo(x+71, y-8,  x+79, y-8,  x+84, y-3);\n        cc.strokeStyle = color;\n        cc.lineWidth = 2;\n        cc.stroke();\n      };\n\n      const drawCtaHelix = () => {\n        cc.clearRect(0, 0, CW, CH);\n        const numCols = Math.ceil(CW / colW) + 1;\n        const numRows = Math.ceil(CH / groupH) + 2;\n\n        for (let col = 0; col < numCols; col++) {\n          const baseX = col * colW + (colW - waveW) / 2;\n          // vitesse légèrement différente par colonne pour effet parallaxe\n          const speed = 0.6 + (col % 3) * 0.2;\n          const yScroll = (ctaOffset * speed * 18 + col * 37) % groupH;\n\n          for (let row = -1; row < numRows; row++) {\n            for (let w = 0; w < 3; w++) {\n              const y = row * groupH + w * lineGap + yScroll;\n              if (y < -20 || y > CH + 20) continue;\n              drawWave(baseX, y, waveColors[w]);\n            }\n          }\n        }\n        ctaOffset += 0.012;\n        ctaRaf = requestAnimationFrame(drawCtaHelix);\n      };\n      drawCtaHelix();\n      const ctaResizeH = () => ctaResize();\n      window.addEventListener('resize', ctaResizeH);\n      this._stopCtaHelix = () => { cancelAnimationFrame(ctaRaf); window.removeEventListener('resize', ctaResizeH); };\n    }\n\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._canvasResize) window.removeEventListener('resize', this._canvasResize);\n    if (this._stopCanvas) this._stopCanvas();\n    if (this._stopDNA) this._stopDNA();\n    if (this._stopNN) this._stopNN();\n    if (this._stopCtaHelix) this._stopCtaHelix();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
