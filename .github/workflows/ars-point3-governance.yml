name: ARS point 3 governance wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-point3-governance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Secure governance wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('presentation-ars/index.html')
          md_path = Path('presentation-ars/CONTENU_SLIDES.md')

          html = html_path.read_text(encoding='utf-8')
          md = md_path.read_text(encoding='utf-8')

          html_replacements = {
              "data-notes=\"Préparer en Q&amp;A : lieu d’hébergement, comité d’accès, critères d’autorisation des requêtes, données pouvant quitter le CHU, articulation éventuelle avec l’EDS, sécurité et risque de ré-identification des données agrégées.\"": "data-notes=\"Principes de gouvernance à formaliser dans le cadre réglementaire retenu. Préparer en Q&amp;A : lieu d’hébergement, comité d’accès, critères d’autorisation des requêtes, données pouvant quitter le CHU, articulation éventuelle avec l’EDS, sécurité et risque de ré-identification des données agrégées.\"",
              "Consentement éclairé et révocable à tout moment, information continue sur l'avancement du projet.": "Information claire des participants, consentement et exercice des droits selon le cadre réglementaire retenu.",
              "Pseudonymisation systématique, hébergement sécurisé, accès tracé et audité.": "Pseudonymisation, hébergement sécurisé et traçabilité des accès selon l'architecture retenue.",
              "Comité de gouvernance dédié, droits d'usage définis projet par projet.": "Gouvernance et règles d'accès à formaliser avant l'ouverture de la ressource.",
              "Distinction stricte recherche / diagnostic ; aucun résultat individuel sans validation clinique.": "Séparation stricte entre recherche et diagnostic ; politique de retour individuel encadrée.",
              "Restitution collective des résultats, vigilance sur toute lecture stigmatisante.": "Restitution collective et vigilance contre toute interprétation stigmatisante."
          }

          for old, new in html_replacements.items():
              if old not in html:
                  raise SystemExit(f'HTML pattern not found: {old}')
              html = html.replace(old, new, 1)

          md_replacements = {
              "**2026-09-03 — Révision (sur demande explicite) :** les 5 cartes ne portaient que 2 mots de\ndescription chacune, jugées trop ternes et pas assez explicites pour l'ARS. Chaque carte est\nétoffée d'une phrase d'engagement concret et gagne une bordure supérieure colorée (navy/teal/\ncoral, cycle repris du style des cartes PRS de la slide 14) pour casser la monotonie visuelle. La\nphrase pivot est centrée dans l'espace libéré sous les cartes.": "**2026-09-03 — Révision (sur demande explicite) :** les 5 cartes ne portaient que 2 mots de\ndescription chacune, jugées trop ternes et pas assez explicites pour l'ARS. Chaque carte est\nétoffée et gagne une bordure supérieure colorée (navy/teal/coral, cycle repris du style des cartes\nPRS de la slide 14) pour casser la monotonie visuelle. La phrase pivot est centrée dans l'espace\nlibéré sous les cartes.\n\n**2026-09-08 — Audit ARS :** les formulations sont sécurisées pour distinguer les principes de\ngouvernance déjà retenus des modalités opérationnelles qui restent à formaliser dans le cadre\nréglementaire applicable au projet.",
              "- **Participants** — Consentement éclairé et révocable à tout moment, information continue sur l'avancement du projet.": "- **Participants** — Information claire des participants, consentement et exercice des droits selon le cadre réglementaire retenu.",
              "- **Données** — Pseudonymisation systématique, hébergement sécurisé, accès tracé et audité.": "- **Données** — Pseudonymisation, hébergement sécurisé et traçabilité des accès selon l'architecture retenue.",
              "- **Accès** — Comité de gouvernance dédié, droits d'usage définis projet par projet.": "- **Accès** — Gouvernance et règles d'accès à formaliser avant l'ouverture de la ressource.",
              "- **Usage clinique** — Distinction stricte recherche / diagnostic ; aucun résultat individuel sans validation clinique.": "- **Usage clinique** — Séparation stricte entre recherche et diagnostic ; politique de retour individuel encadrée.",
              "- **Population** — Restitution collective des résultats, vigilance sur toute lecture stigmatisante.": "- **Population** — Restitution collective et vigilance contre toute interprétation stigmatisante.",
              "Cinq dimensions structurent ce cadre. Le consentement et l'information des participants, en amont. La pseudonymisation et la sécurité des données, sur le plan technique. La gouvernance de l'accès et des droits d'usage, sur le plan organisationnel. La distinction claire entre recherche et diagnostic, sur le plan clinique. Et, pour la population dans son ensemble, la question de la non-stigmatisation et de la restitution des résultats.": "Cinq dimensions structurent ce cadre. L'information, le consentement et l'exercice des droits des participants, d'abord. La pseudonymisation, la sécurité et la traçabilité des accès, ensuite. Les règles d'accès et de gouvernance devront être formalisées avant l'ouverture de la ressource. Sur le plan clinique, recherche et diagnostic resteront strictement distingués, avec une politique de retour individuel encadrée. Enfin, pour la population dans son ensemble, nous devons prévoir une restitution collective et une vigilance constante contre toute interprétation stigmatisante."
          }

          for old, new in md_replacements.items():
              if old not in md:
                  raise SystemExit(f'MD pattern not found: {old[:120]}')
              md = md.replace(old, new, 1)

          html_path.write_text(html, encoding='utf-8')
          md_path.write_text(md, encoding='utf-8')
          PY

          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add presentation-ars/index.html presentation-ars/CONTENU_SLIDES.md
          git commit -m 'Sécurise les formulations de gouvernance ARS'
          git push origin main
