name: ARS point 11 numbering sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-point11-numbering.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize 25-screen numbering
        run: python presentation-ars/tools/point11_patch.py
      - name: Commit changes
        run: |
          git config user.name "patrick-mun"
          git config user.email "78493429+patrick-mun@users.noreply.github.com"
          git add presentation-ars/index.html presentation-ars/CONTENU_SLIDES.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Synchronise la présentation ARS sur 25 écrans"
          git push origin main
