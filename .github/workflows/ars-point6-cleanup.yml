name: ARS point 6 cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-point6-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Cleanup residual PCA wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('presentation-ars/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('La preuve pilote suit à la slide suivante.', "L'observation pilote suit à la slide suivante."),
              ('<!-- 07 — La preuve locale (PCA) -->', '<!-- 07 — Observation pilote (PCA) -->'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Marker not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "patrick-mun"
          git config user.email "78493429+patrick-mun@users.noreply.github.com"
          git add presentation-ars/index.html
          git commit -m "Finalise le vocabulaire observation pilote de la PCA"
          git push origin main
