name: ARS point 4 institutional roles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-point4-roles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Secure institutional role wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('presentation-ars/index.html')
          md_path = Path('presentation-ars/CONTENU_SLIDES.md')
          html = html_path.read_text(encoding='utf-8')
          md = md_path.read_text(encoding='utf-8')

          replacements_html = [
              (
                  "data-notes=\"Ce projet n'a pas besoin que l'ARS fasse le travail d'un autre acteur.\"",
                  "data-notes=\"Rôles complémentaires : ne pas présenter les contributions de la Région, des dispositifs nationaux ou de l’ARS comme des engagements déjà acquis ; distinguer clairement accès national, leviers de financement et rôle sanitaire régional.\"",
              ),
              (
                  "<li>Financement des infrastructures et équipements</li>",
                  "<li>Leviers de financement des infrastructures et équipements</li>",
              ),
              (
                  "<li>Séquençage via les plateformes nationales (AURAGEN / SeqOIA)</li>",
                  "<li>Accès national au séquençage génomique clinique via AURAGEN / SeqOIA</li>",
              ),
              (
                  "<li>Référentiels et cadre réglementaire (Plan France Médecine Génomique)</li>",
                  "<li>Stratégie et organisation nationales de médecine génomique (PFMG)</li>",
              ),
              (
                  "<li>Articulation avec la stratégie nationale</li>",
                  "<li>Articulation avec les dispositifs et infrastructures nationaux</li>",
              ),
          ]
          for old, new in replacements_html:
              if old not in html:
                  raise SystemExit(f'HTML marker not found: {old}')
              html = html.replace(old, new, 1)

          old_md_block = (
              "- **CHU** — Porteur scientifique et clinique du projet · Recueil, hébergement et analyse des données génomiques · Recherche et interprétation clinique\n"
              "- **Région** — Financement des infrastructures et équipements · Soutien à l'innovation et à l'attractivité territoriale · Renforcement de la capacité de recherche locale\n"
              "- **État et dispositifs nationaux** — Séquençage via les plateformes nationales (AURAGEN / SeqOIA) · Référentiels et cadre réglementaire (Plan France Médecine Génomique) · Articulation avec la stratégie nationale\n"
              "- **ARS** — Lecture sanitaire régionale et priorisation des besoins · Veille sur l'équité d'accès et la prévention · Articulation avec le PRS 2023-2033 et l'offre de soins"
          )
          new_md_block = (
              "- **CHU** — Porteur scientifique et clinique du projet · Recueil, hébergement et analyse des données génomiques · Recherche et interprétation clinique\n"
              "- **Région** — Leviers de financement des infrastructures et équipements · Soutien à l'innovation et à l'attractivité territoriale · Renforcement de la capacité de recherche locale\n"
              "- **État et dispositifs nationaux** — Accès national au séquençage génomique clinique via AURAGEN / SeqOIA · Stratégie et organisation nationales de médecine génomique (PFMG) · Articulation avec les dispositifs et infrastructures nationaux\n"
              "- **ARS** — Lecture sanitaire régionale et priorisation des besoins · Veille sur l'équité d'accès et la prévention · Articulation avec le PRS 2023-2033, l'OMEDIT et l'offre de soins"
          )
          if old_md_block not in md:
              raise SystemExit('Markdown role block not found')
          md = md.replace(old_md_block, new_md_block, 1)

          old_oral = (
              "Le CHU porte l'expertise clinique, génétique et scientifique — c'est le porteur médical naturel du projet. La Région apporte l'infrastructure et une capacité d'investissement territorial. L'État et les dispositifs nationaux fournissent le cadre, le séquençage clinique et les référentiels de référence.\n\n"
              "L'ARS a un rôle différent de ces trois-là, et c'est précisément celui qui nous intéresse ici : une lecture sanitaire du projet, une attention à l'équité, une articulation avec le Projet régional de santé, l'offre de soins et la prévention. Ce n'est pas un rôle de financeur parmi d'autres. C'est un rôle qu'aucun des trois autres acteurs ne peut occuper à sa place."
          )
          new_oral = (
              "Le CHU porte l'expertise clinique, génétique et scientifique — c'est le porteur médical naturel du projet. La Région peut mobiliser des leviers de financement et d'innovation territoriale, sans préjuger ici d'un engagement déjà accordé. Les dispositifs nationaux, eux, organisent l'accès au séquençage génomique clinique — notamment via AURAGEN et SeqOIA — et la stratégie nationale portée par le PFMG ; cela ne signifie pas que le séquençage de Génome Réunion serait nécessairement réalisé par ces plateformes.\n\n"
              "L'ARS a un rôle différent de ces trois-là, et c'est précisément celui qui nous intéresse ici : une lecture sanitaire du projet, une attention à l'équité et à la prévention, et une articulation avec le Projet régional de santé, l'OMEDIT et l'offre de soins. Ce n'est pas un rôle de financeur parmi d'autres. C'est un rôle qu'aucun des trois autres acteurs ne peut occuper à sa place."
          )
          if old_oral not in md:
              raise SystemExit('Markdown oral block not found')
          md = md.replace(old_oral, new_oral, 1)

          md_anchor = "**2026-09-03 — Révision (sur demande explicite) :** les 4 cartes n'avaient qu'une ligne de"
          if md_anchor in md and "Révision institutionnelle 2026-09-08" not in md:
              insert = (
                  "**Révision institutionnelle 2026-09-08 :** les formulations sont sécurisées pour distinguer les rôles possibles des engagements déjà acquis : la Région est présentée comme levier de financement, AURAGEN/SeqOIA comme accès national au séquençage clinique, et le PFMG comme stratégie et organisation nationales — pas comme cadre réglementaire du projet. L'OMEDIT est explicitement rattaché au rôle sanitaire de l'ARS.\n\n"
              )
              pos = md.index(md_anchor)
              md = md[:pos] + insert + md[pos:]

          html_path.write_text(html, encoding='utf-8')
          md_path.write_text(md, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "patrick-mun"
          git config user.email "78493429+patrick-mun@users.noreply.github.com"
          git add presentation-ars/index.html presentation-ars/CONTENU_SLIDES.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Sécurise les rôles institutionnels de la présentation ARS"
          git push origin main
