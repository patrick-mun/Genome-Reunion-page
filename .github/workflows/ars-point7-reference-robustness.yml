name: ARS point 7 reference robustness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-point7-reference-robustness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harmonize reference robustness wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('presentation-ars/index.html')
          md_path = Path('presentation-ars/CONTENU_SLIDES.md')
          html = html_path.read_text(encoding='utf-8')
          md = md_path.read_text(encoding='utf-8')

          replacements = [
              (
                  "aria-label=\"Des données de référence dont la profondeur de représentation est inégale selon les populations, passées au même algorithme, aboutissent à un référentiel adapté pour certains patients et insuffisant pour d'autres\"",
                  "aria-label=\"Des données de référence dont la profondeur de représentation varie selon les populations sont mobilisées par les mêmes outils d'interprétation ; selon la représentativité disponible, l'information populationnelle peut être plus robuste ou plus limitée.\"",
              ),
              (
                  ">Patient</text>",
                  ">Population mieux représentée</text>",
              ),
              (
                  ">✓ référentiel adapté</text>",
                  ">information plus robuste</text>",
              ),
          ]
          for old, new in replacements:
              if old not in html:
                  raise SystemExit(f'HTML marker not found: {old}')
              html = html.replace(old, new, 1)

          if ">Patient</text>" not in html:
              raise SystemExit('Second Patient marker not found')
          html = html.replace(">Patient</text>", ">Population moins représentée</text>", 1)

          if ">! référentiel insuffisant</text>" not in html:
              raise SystemExit('Insufficient reference marker not found')
          html = html.replace(">! référentiel insuffisant</text>", ">information plus limitée</text>", 1)

          old_note = "data-notes=\"Les grandes bases sont indispensables mais représentent différemment les populations.\""
          new_note = "data-notes=\"Les grandes bases sont indispensables mais représentent différemment les populations ; parler de robustesse variable de l'information populationnelle, jamais de référentiel globalement adapté ou insuffisant.\""
          if old_note in html:
              html = html.replace(old_note, new_note, 1)

          md_old = "**Données de référence** → **Algorithmes / interprétation / recommandations** → **Patients**"
          md_new = "**Données de référence** → **Algorithmes / interprétation / recommandations** → **Robustesse de l'information populationnelle**"
          if md_old in md:
              md = md.replace(md_old, md_new, 1)

          anchor = "- Éviter tout visuel qui ressemblerait à une hiérarchie de qualité entre populations — c'est une question de profondeur de données, pas de valeur."
          addition = anchor + "\n- À l'issue du schéma, parler d'une **information populationnelle plus robuste ou plus limitée** selon la représentativité ; ne pas qualifier un référentiel entier d'« adapté » ou d'« insuffisant »."
          if anchor in md and "information populationnelle plus robuste ou plus limitée" not in md:
              md = md.replace(anchor, addition, 1)

          html_path.write_text(html, encoding='utf-8')
          md_path.write_text(md, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "patrick-mun"
          git config user.email "78493429+patrick-mun@users.noreply.github.com"
          git add presentation-ars/index.html presentation-ars/CONTENU_SLIDES.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Nuance la robustesse des référentiels dans la présentation ARS"
          git push origin main
