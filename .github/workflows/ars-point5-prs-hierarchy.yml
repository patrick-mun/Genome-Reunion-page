name: ARS point 5 PRS hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-point5-prs-hierarchy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply PRS hierarchy patch
        run: python presentation-ars/tools/point5_patch.py

      - name: Commit changes
        run: |
          git config user.name "patrick-mun"
          git config user.email "78493429+patrick-mun@users.noreply.github.com"
          git add presentation-ars/index.html presentation-ars/css/slides/s02-reponse.css presentation-ars/CONTENU_SLIDES.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Hiérarchise l'ancrage PRS dans la présentation ARS"
          git push origin main
