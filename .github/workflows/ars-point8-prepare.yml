name: ARS point 8 PREPARE wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-point8-prepare.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refine PREPARE wording on slide 19
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('presentation-ars/index.html')
          md_path = Path('presentation-ars/CONTENU_SLIDES.md')
          html = html_path.read_text(encoding='utf-8')
          md = md_path.read_text(encoding='utf-8')

          old_html = "Une stratégie pharmacogénétique préemptive peut réduire certains effets indésirables — la transférabilité à une population très admixée reste à documenter localement."
          new_html = "Dans PREPARE, une stratégie pharmacogénétique préemptive guidée par un panel de 12 gènes a été associée à une réduction des effets indésirables médicamenteux cliniquement pertinents dans le cadre étudié. Transférabilité et intérêt médico-économique à La Réunion : à évaluer."
          if old_html not in html:
              raise SystemExit('PREPARE sentence not found in index.html')
          html = html.replace(old_html, new_html, 1)

          old_md = "> PREPARE / U-PGx : une stratégie pharmacogénétique préemptive peut réduire certains effets indésirables — la transférabilité à une population très admixée reste à documenter localement."
          new_md = "> PREPARE / U-PGx : dans PREPARE, une stratégie pharmacogénétique préemptive guidée par un panel de 12 gènes a été associée à une réduction des effets indésirables médicamenteux cliniquement pertinents dans le cadre étudié. Transférabilité et intérêt médico-économique à La Réunion : à évaluer."
          if old_md not in md:
              raise SystemExit('PREPARE callout not found in CONTENU_SLIDES.md')
          md = md.replace(old_md, new_md, 1)

          old_oral = """L'étude européenne PREPARE, menée dans le cadre du consortium U-PGx, a démontré qu'une stratégie pharmacogénétique préemptive — c'est-à-dire connue avant la prescription plutôt que découverte après un incident — pouvait réduire certains effets indésirables. C'est un démonstrateur solide de l'intérêt clinique de l'approche.

Mais cette étude n'a pas été conduite sur une population aussi admixée que celle de La Réunion. La question de la transférabilité de ces résultats reste donc, à ce stade, une question à documenter — pas une réponse déjà acquise."""
          new_oral = """Dans PREPARE, étude européenne menée dans le cadre du consortium U-PGx, 6 944 participants ont été inclus. Une stratégie pharmacogénétique préemptive guidée par un panel de 12 gènes a été associée à une diminution des effets indésirables médicamenteux cliniquement pertinents dans le cadre étudié.

Mais 97,7 % des participants se déclaraient européens, méditerranéens ou moyen-orientaux. Ce résultat constitue un argument clinique important, sans préjuger du bénéfice à La Réunion : la transférabilité à une population fortement admixée, les couples gène–médicament prioritaires et l'intérêt médico-économique local restent à évaluer."""
          if old_oral not in md:
              raise SystemExit('PREPARE oral block not found in CONTENU_SLIDES.md')
          md = md.replace(old_oral, new_oral, 1)

          old_ref = "- PREPARE / U-PGx (démonstrateur européen de pharmacogénétique préemptive)."
          new_ref = "- PREPARE / U-PGx, *Lancet* 2023 : étude d'implémentation d'un panel pharmacogénétique de 12 gènes, 6 944 participants ; interprétation locale à discuter au regard de la structure de population et du contexte de soins réunionnais."
          if old_ref in md:
              md = md.replace(old_ref, new_ref, 1)

          html_path.write_text(html, encoding='utf-8')
          md_path.write_text(md, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "patrick-mun"
          git config user.email "78493429+patrick-mun@users.noreply.github.com"
          git add presentation-ars/index.html presentation-ars/CONTENU_SLIDES.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Précise la portée de PREPARE sur la slide 19"
          git push origin main
