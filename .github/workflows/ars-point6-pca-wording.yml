name: ARS point 6 PCA wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-point6-pca-wording.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Harmonize PCA wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('presentation-ars/index.html')
          md_path = Path('presentation-ars/CONTENU_SLIDES.md')
          html = html_path.read_text(encoding='utf-8')
          md = md_path.read_text(encoding='utf-8')

          html_replacements = [
              ('<span class="toc-tag">Preuve locale (PCA)</span>', '<span class="toc-tag">Observation pilote (PCA)</span>'),
              ('data-label="07 — La preuve locale (PCA)"', 'data-label="07 — Observation pilote (PCA)"'),
              ('<span class="slide-eyebrow">Preuve visuelle</span>', '<span class="slide-eyebrow">Observation pilote</span>'),
          ]
          for old, new in html_replacements:
              if old not in html:
                  raise SystemExit(f'HTML marker not found: {old}')
              html = html.replace(old, new, 1)

          md_replacements = [
              ('6. La preuve locale (PCA pilote) *(code 07)*', '6. Observation pilote locale (PCA) *(code 07)*'),
              ('La preuve réelle suit à la slide suivante.', "L'observation pilote suit à la slide suivante."),
              ('(la preuve arrive slide suivante avec la PCA).', "(l'observation pilote arrive à la slide suivante avec la PCA)."),
              ('pour ne pas préempter la preuve réelle.', "pour ne pas préempter l'observation réelle."),
              ('## SLIDE 6 — LA PREUVE LOCALE (PCA) 🟡', '## SLIDE 6 — OBSERVATION PILOTE LOCALE (PCA) 🟢'),
              ('> Une première observation locale : la diversité réunionnaise forme un continuum', "> Une première observation locale : des positions compatibles avec un continuum d'admixture"),
          ]
          for old, new in md_replacements:
              if old not in md:
                  raise SystemExit(f'Markdown marker not found: {old}')
              md = md.replace(old, new, 1)

          note_anchor = '## SLIDE 6 — OBSERVATION PILOTE LOCALE (PCA) 🟢'
          if 'Révision terminologique 2026-09-08' not in md:
              insert = "\n\n**Révision terminologique 2026-09-08 :** le vocabulaire « preuve visuelle / preuve locale » est remplacé par « observation pilote » afin de refléter le statut réel de la cohorte n≈75. La PCA reste une donnée locale informative, mais n’est pas présentée comme une démonstration exhaustive de la population réunionnaise."
              pos = md.index(note_anchor) + len(note_anchor)
              md = md[:pos] + insert + md[pos:]

          html_path.write_text(html, encoding='utf-8')
          md_path.write_text(md, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "patrick-mun"
          git config user.email "78493429+patrick-mun@users.noreply.github.com"
          git add presentation-ars/index.html presentation-ars/CONTENU_SLIDES.md
          git commit -m "Remplace la notion de preuve par observation pilote pour la PCA"
          git push origin main
