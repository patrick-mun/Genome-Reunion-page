name: ARS point 14 documentation sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-point14-doc-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Harmonize presentation documentation
        run: python presentation-ars/tools/point14_patch.py
      - name: Commit changes
        run: |
          git config user.name "patrick-mun"
          git config user.email "78493429+patrick-mun@users.noreply.github.com"
          git add presentation-ars/CONTENU_SLIDES.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Harmonise la documentation ARS après les corrections"
          git push origin main
